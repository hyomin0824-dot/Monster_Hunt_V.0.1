<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Cartoon Monster Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<style>
:root{
  color-scheme: light;
  --sky1:#7fcdf5; --sky2:#d4f1ff; --field1:#a8e07f; --field2:#79c25a;
  --cloud:#ffffff; --hill1:#6fbf4f; --hill2:#4f9e38;
  --castle:#6b4fa3; --castle-dark:#3e2a66; --roof:#c0392b; --flag:#f1c40f;
  --pine:#1f6b35; --pine2:#2e8a47; --trunk:#6b4423;
  --panel:rgba(255,250,235,.93); --panel-edge:#f2b632; --panel-shadow:#c98a10;
  --ink:#3b2a14; --ink-soft:#7a6040;
  --board-bg:#fdeec2;
  --tile:#f5c33b; --tile-hi:#ffd965; --tile-edge:#c98f12; --tile-hover:#ffe58a;
  --tile-open:#efe2c0;
  --chip:#ffffff; --input:#ffffff; --input-edge:#f2c25a;
  --banner:#ffe69a; --banner-ink:#6b4a05; --mine-bg:#b8f0a6; --mine-ink:#14501f;
  --g:#36b864; --g-e:#1f8045; --b:#3aa0e0; --b-e:#1f6fa3; --r:#ea4c46; --r-e:#a82a26; --y:#f0a01c; --y-e:#b0700a;
  --pos:#1f9d55; --neg:#e0413b; --shade:rgba(40,25,5,.55);
  --toast-bg:#3b2a14; --toast-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --sky1:#0b1433; --sky2:#232c58; --field1:#24482a; --field2:#15301a;
    --cloud:#4a5888; --hill1:#2d5a30; --hill2:#1e4222;
    --castle:#8e78c9; --castle-dark:#40306a; --roof:#b8473a; --flag:#e0b52a;
    --pine:#3f8f55; --pine2:#2f7344; --trunk:#7a5233;
    --panel:rgba(40,32,54,.94); --panel-edge:#c9922a; --panel-shadow:#6e4f10;
    --ink:#fbeed3; --ink-soft:#cbb68f;
    --board-bg:#2f2640;
    --tile:#c4912a; --tile-hi:#d9a83c; --tile-edge:#7d5a10; --tile-hover:#e8bd55;
    --tile-open:#45395c;
    --chip:#3a2f4d; --input:#211a2e; --input-edge:#8a6a2a;
    --banner:#4e3c12; --banner-ink:#ffe2a0; --mine-bg:#1f5a2b; --mine-ink:#c8ffc0;
    --pos:#5ee08e; --neg:#ff7a72; --shade:rgba(0,0,0,.65);
    --toast-bg:#fbeed3; --toast-ink:#2b2238;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  font-family:'Fredoka',system-ui,sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none;
  min-height:100vh; padding:12px; display:flex; flex-direction:column; align-items:center; gap:12px;
  background:linear-gradient(to bottom,var(--sky1) 0%,var(--sky2) 42%,var(--field1) 68%,var(--field2) 100%) fixed;
}
.scene{position:fixed;inset:0;width:100%;height:100%;opacity:.28;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:620px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:4px solid var(--panel-edge);border-radius:24px;box-shadow:0 7px 0 var(--panel-shadow),0 14px 28px rgba(0,0,0,.18);padding:16px}
header.panel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:20px}
h1{margin:0;font-size:clamp(20px,5.5vw,28px);font-weight:700;color:var(--panel-edge);text-shadow:0 2px 0 var(--panel-shadow);line-height:1.1}
#status{margin:2px 0 0;font-size:13px;color:var(--ink-soft);font-weight:500}
h2{margin:0 0 12px;font-size:26px;text-align:center}
p{margin:0}
.btn{font:inherit;font-weight:700;font-size:18px;border:none;border-radius:16px;padding:12px 16px;color:#fff;cursor:pointer;background:var(--bg);box-shadow:0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{filter:grayscale(.75);opacity:.55;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,.pick:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.green{--bg:var(--g);--edge:var(--g-e)} .blue{--bg:var(--b);--edge:var(--b-e)} .red{--bg:var(--r);--edge:var(--r-e)} .yellow{--bg:var(--y);--edge:var(--y-e)}
.btn.small{font-size:15px;padding:8px 12px;border-radius:12px;box-shadow:0 4px 0 var(--edge)}
.full{width:100%}
input{font:inherit;font-weight:600;font-size:20px;text-align:center;color:var(--ink);background:var(--input);border:3px solid var(--input-edge);border-radius:14px;padding:10px;width:100%}
input::placeholder{color:var(--ink-soft);opacity:.7}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-weight:600;margin:14px 0}
.or::before,.or::after{content:"";flex:1;border-top:2px dashed var(--input-edge)}
.row{display:flex;gap:8px}
.err{color:var(--neg);font-weight:600;text-align:center;margin-top:12px;min-height:1.2em}
.lobby-art{display:flex;justify-content:center;gap:4px;margin-bottom:8px}
.lobby-art span{width:44px;height:44px}
.lobby-art svg,.pick-art svg,.leg svg,.art svg,.stack svg{width:100%;height:100%;display:block}

/* room */
.code{font-size:44px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--panel-edge);text-shadow:0 3px 0 var(--panel-shadow);user-select:text;-webkit-user-select:text}
.hint{text-align:center;color:var(--ink-soft);font-size:15px;margin-bottom:12px}
.players{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip,.score{display:flex;align-items:center;gap:6px;background:var(--chip);border:3px solid var(--c);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
small{font-weight:500;color:var(--ink-soft)}

/* game */
#scoreboard{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.score{font-size:14px;padding:4px 10px}
.score b{font-size:16px}
.score .pos{color:var(--pos)} .score .neg{color:var(--neg)}
.score.turn{background:var(--banner);transform:scale(1.07);box-shadow:0 3px 0 var(--c)}
.banner{background:var(--banner);color:var(--banner-ink);border-radius:14px;text-align:center;font-weight:700;font-size:17px;padding:8px 10px;margin-bottom:10px}
.banner.mine{background:var(--mine-bg);color:var(--mine-ink);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.tray{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.pick{font:inherit;color:var(--ink);background:var(--chip);border:3px solid var(--input-edge);border-radius:14px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;width:68px;cursor:pointer}
.pick.sel{border-color:var(--g);background:var(--mine-bg);transform:translateY(-3px);box-shadow:0 3px 0 var(--g-e)}
.pick.empty{opacity:.4}
.pick-art{width:38px;height:38px}
.pick-name{font-size:12px;font-weight:600}
.pick-left{font-size:13px;font-weight:700}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;margin-bottom:10px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.leg{display:flex;align-items:center;gap:3px}
.leg span:first-child{width:24px;height:24px}

#boardWrap{position:relative;max-width:460px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;background:var(--board-bg);padding:6px;border-radius:16px;border:4px solid var(--panel-edge)}
.hdr{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink-soft);font-size:clamp(11px,3.4vw,16px)}
.tile{aspect-ratio:1;border-radius:9px;position:relative;display:flex;align-items:center;justify-content:center;padding:0;border:none;font:inherit;color:var(--ink);cursor:default;transition:transform .1s,background .1s}
.tile.closed{background:linear-gradient(var(--tile-hi),var(--tile));box-shadow:inset 0 -3px 0 var(--tile-edge)}
.tile.open{background:var(--tile-open);box-shadow:inset 0 0 0 3px var(--striker),inset 0 3px 5px rgba(0,0,0,.15)}
.tile.can{cursor:pointer}
.tile.can:hover{background:var(--tile-hover);transform:scale(1.07);z-index:2}
.tile.firing.can{cursor:crosshair}
.tile.mine{box-shadow:inset 0 0 0 3px var(--me),inset 0 -3px 0 var(--tile-edge)}
.tile.mine.locked .art{opacity:.55}
.art{width:84%;height:84%;display:block}
.stack{width:94%;height:94%;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center}
.stack span{width:100%;height:100%}
.pts{position:absolute;bottom:-3px;right:-3px;font-size:10px;font-weight:700;color:#fff;background:var(--g-e);border-radius:6px;padding:0 3px;line-height:1.35;z-index:1}
.pts.neg{background:var(--r-e)}
.lock{position:absolute;top:-2px;right:-1px;font-size:9px;line-height:1}
.tile.last{animation:glow 1.4s ease-in-out 2}
@keyframes glow{50%{filter:brightness(1.25)}}
.tile.pop .art,.tile.pop .stack{animation:popIn .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes popIn{0%{transform:scale(.15)}100%{transform:scale(1)}}
.firerow{display:flex;align-items:flex-end;gap:8px;margin-top:6px;min-height:48px}
#cannon{width:64px;height:45px;flex:none;transform-origin:30% 80%}
#cannon.fire{animation:recoil .4s ease-out}
@keyframes recoil{25%{transform:translateX(-8px) rotate(5deg)}}
.firerow p{font-size:13px;color:var(--ink-soft);font-weight:500;padding-bottom:4px}
.log{list-style:none;margin:10px 0 0;padding:8px 10px;background:var(--chip);border-radius:14px;font-size:14px;max-height:132px;overflow:auto;border:2px dashed var(--input-edge)}
.log li{padding:2px 0}
.log li:first-child{font-weight:600}

/* effects */
#fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
.ball{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9a9a9a 0,#3a3a3a 35%,#0d0d0d 72%);box-shadow:0 3px 6px rgba(0,0,0,.45)}
.puff{position:absolute;left:var(--x);top:var(--y);width:var(--s,12px);height:var(--s,12px);border-radius:50%;background:rgba(225,225,225,.85);transform:translate(-50%,-50%);animation:puff .6s ease-out forwards}
@keyframes puff{from{opacity:.9;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
.boom{position:absolute;left:var(--x);top:var(--y);width:120px;height:120px;transform:translate(-50%,-50%);animation:boom .6s ease-out forwards}
.boom svg{width:100%;height:100%}
.boom span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;color:#fff;-webkit-text-stroke:1.5px #b3261e;text-shadow:0 2px 0 #b3261e}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:1}55%{transform:translate(-50%,-50%) scale(1.2) rotate(6deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.45) rotate(10deg);opacity:0}}
.debris{position:absolute;left:var(--x);top:var(--y);width:8px;height:8px;border-radius:2px;background:var(--dc);animation:debris .65s ease-out forwards}
@keyframes debris{from{transform:translate(-50%,-50%)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(220deg);opacity:0}}
.float{position:absolute;left:var(--x);top:var(--y);font-weight:700;font-size:26px;color:var(--fc);-webkit-text-stroke:1.2px rgba(0,0,0,.45);text-shadow:0 2px 0 rgba(0,0,0,.25);animation:floatUp 1.4s ease-out forwards;white-space:nowrap}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-80%) scale(1.2);opacity:1}100%{transform:translate(-50%,-240%) scale(1);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .panel{max-width:360px;width:100%;text-align:center;animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
.overlay h3{margin:0 0 6px;font-size:28px}
.overlay p{color:var(--ink-soft);font-weight:500;margin-bottom:14px}
.rank{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:8px;background:var(--chip);border:3px solid var(--c);border-radius:14px;padding:6px 10px;font-weight:600}
.rank li .m{font-size:22px;width:28px}
.rank li .nm{flex:1;text-align:left}
[data-pid]{-webkit-touch-callout:none;touch-action:manipulation}
.cover{z-index:80;background:linear-gradient(to bottom,var(--sky1),var(--field1));visibility:hidden;animation:coverIn 0s forwards}
.cover.late{animation-delay:1.5s}
@keyframes coverIn{to{visibility:visible}}
.cover .panel{padding:24px}
.cover .big{font-size:54px;line-height:1;margin-bottom:8px}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--toast-bg);color:var(--toast-ink);font-weight:600;padding:10px 16px;border-radius:14px;z-index:60;transition:transform .25s;max-width:90vw;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.banner.mine{animation:none}.shake{animation:none}}
</style>
</head>
<body>

<!-- faint background: castle left, plains, forest right -->
<svg class="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <g fill="var(--cloud)">
    <ellipse cx="430" cy="140" rx="70" ry="26"/><ellipse cx="478" cy="122" rx="48" ry="30"/><ellipse cx="388" cy="128" rx="40" ry="22"/>
    <ellipse cx="800" cy="92" rx="80" ry="24"/><ellipse cx="846" cy="74" rx="46" ry="28"/><ellipse cx="760" cy="80" rx="34" ry="20"/>
  </g>
  <path d="M0 560 C200 500 380 540 600 520 C820 500 1000 530 1200 500 L1200 800 L0 800Z" fill="var(--hill1)"/>
  <g id="castle">
    <rect x="70" y="380" width="260" height="250" fill="var(--castle)"/>
    <rect x="34" y="300" width="84" height="330" fill="var(--castle)"/>
    <rect x="282" y="300" width="84" height="330" fill="var(--castle)"/>
    <rect x="148" y="250" width="104" height="160" fill="var(--castle)"/>
    <g fill="var(--castle)">
      <rect x="122" y="358" width="20" height="24"/><rect x="160" y="358" width="20" height="24" opacity="0"/><rect x="258" y="358" width="20" height="24"/>
    </g>
    <polygon points="24,302 76,196 128,302" fill="var(--roof)"/>
    <polygon points="272,302 324,196 376,302" fill="var(--roof)"/>
    <polygon points="138,252 200,140 262,252" fill="var(--roof)"/>
    <line x1="200" y1="140" x2="200" y2="96" stroke="var(--castle-dark)" stroke-width="5"/>
    <polygon points="200,96 240,108 200,120" fill="var(--flag)"/>
    <line x1="76" y1="196" x2="76" y2="166" stroke="var(--castle-dark)" stroke-width="4"/>
    <polygon points="76,166 102,174 76,182" fill="var(--flag)"/>
    <line x1="324" y1="196" x2="324" y2="166" stroke="var(--castle-dark)" stroke-width="4"/>
    <polygon points="324,166 350,174 324,182" fill="var(--flag)"/>
    <path d="M168 630 L168 548 A32 32 0 0 1 232 548 L232 630Z" fill="var(--castle-dark)"/>
    <rect x="66" y="360" width="20" height="34" rx="10" fill="var(--castle-dark)"/>
    <rect x="314" y="360" width="20" height="34" rx="10" fill="var(--castle-dark)"/>
    <rect x="190" y="290" width="20" height="34" rx="10" fill="var(--castle-dark)"/>
  </g>
  <g id="forest"></g>
  <path d="M0 650 C250 610 500 660 700 630 C900 600 1050 640 1200 610 L1200 800 L0 800Z" fill="var(--hill2)"/>
</svg>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="mail" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#9aa5b1"/><circle cx="3" cy="3" r="2" fill="none" stroke="#5d6873" stroke-width="1"/>
    </pattern>
  </defs>
</svg>

<div class="wrap">
  <header class="panel">
    <div>
      <h1>🏰 Cartoon Monster Hunt</h1>
      <p id="status">Not in a room</p>
    </div>
    <button id="leaveBtn" class="btn red small" hidden>🚪 Leave</button>
  </header>

  <!-- LOBBY -->
  <main id="lobby" class="panel">
    <div class="lobby-art" id="lobbyArt"></div>
    <h2>Enter the hunt!</h2>
    <input id="playerName" maxlength="14" placeholder="Your name" autocomplete="off">
    <div style="height:12px"></div>
    <button id="createBtn" class="btn green full">👑 Create a room</button>
    <div class="or">or join a friend</div>
    <div class="row">
      <input id="roomInput" maxlength="5" placeholder="Room code" autocomplete="off" style="text-transform:uppercase;flex:2">
      <button id="joinBtn" class="btn blue" style="flex:1">Join</button>
    </div>
    <div class="or">or share one screen</div>
    <input id="localNames" maxlength="120" placeholder="Names, separated by commas" autocomplete="off">
    <button id="localBtn" class="btn yellow full" style="margin-top:8px">📱 Play on one device</button>
    <p id="lobbyMsg" class="err"></p>
  </main>

  <!-- WAITING ROOM -->
  <main id="room" class="panel" hidden>
    <p class="hint">Share this room code with your friends</p>
    <div class="code" id="roomCode"></div>
    <div style="height:10px"></div>
    <ul class="players" id="roomPlayers"></ul>
    <p class="hint" id="roomTip" hidden>Host tip: press and hold a player to rename or remove them.</p>
    <button id="startBtn" class="btn green full">⚔️ Start the hunt</button>
    <p class="hint" id="roomWait" style="margin:12px 0 0"></p>
  </main>

  <!-- GAME -->
  <main id="game" class="panel" hidden>
    <div id="scoreboard"></div>
    <div id="banner" class="banner"></div>
    <div id="tray" class="tray"></div>
    <div id="actions" class="actions"></div>
    <div id="legend" class="legend"></div>
    <div id="boardWrap">
      <div id="grid" class="board"></div>
      <div class="firerow">
        <span id="cannon"></span>
        <p id="fireHint"></p>
      </div>
      <div id="fx"></div>
    </div>
    <ul id="log" class="log"></ul>
  </main>
</div>

<div id="over" class="overlay" hidden>
  <div class="panel">
    <h3>🏁 Hunt over!</h3>
    <p id="overReason"></p>
    <ul class="rank" id="rank"></ul>
    <div class="row" id="overBtns"></div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <div class="panel">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button id="modalOk" class="btn yellow full">OK</button>
  </div>
</div>

<div id="pmenu" class="overlay" hidden style="z-index:70">
  <div class="panel">
    <h3 id="pmTitle"></h3>
    <p>Rename this player or remove them from the game.</p>
    <input id="pmName" maxlength="14" autocomplete="off">
    <div style="height:10px"></div>
    <button id="pmSave" class="btn green full">✏️ Save name</button>
    <div style="height:8px"></div>
    <button id="pmKick" class="btn red full">🥾 Remove from game</button>
    <div style="height:8px"></div>
    <button id="pmCancel" class="btn yellow full">Cancel</button>
  </div>
</div>

<div id="cover" class="overlay cover" hidden>
  <div class="panel">
    <div class="big">📱</div>
    <h3 id="coverTitle"></h3>
    <p id="coverText"></p>
    <button id="coverOk" class="btn green full"></button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ---------- constants ---------- */
const ROWS=['A','B','C','D','E','F','G','H','I'];
const COLS=[1,2,3,4,5,6,7,8,9];
const TYPES={
  BLOB:{name:'Blob',min:1,max:2,count:15},
  GUARD:{name:'Guard',min:3,max:6,count:6},
  SORCERER:{name:'Sorcerer',min:-2,max:-1,count:4},
  QUEEN:{name:'Queen',min:13,max:17,count:1},
  KING:{name:'King',min:20,max:25,count:1}
};
const ORDER=['BLOB','GUARD','SORCERER','QUEEN','KING'];
const COLORS=['#e74c3c','#3498db','#27ae60','#9b59b6','#f39c12','#16a085','#e84393','#8d6e63'];
const MAX_PLAYERS=8;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const fmt=n=>(n>0?'+':'')+n;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function star(cx,cy,R,r,n=5){const p=[];for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2,d=i%2?r:R;p.push((cx+Math.cos(a)*d).toFixed(1)+','+(cy+Math.sin(a)*d).toFixed(1));}return p.join(' ');}

/* ---------- state ---------- */
let peer=null, isHost=false, myId='', hostConn=null, session=0;
const conns=new Map();          // host: peerId -> connection
let G=null;                     // host: full game state (secret)
let V=null;                     // everyone: my filtered view
let isLocal=false, pendingViewer=null;
let lastSeq=0, animating=false, strikeLock=false, selectedType='BLOB';
const evQueue=[], hiddenSet=new Set();

/* =================================================================
   HOST LOGIC (authoritative)
   ================================================================= */
function emptyTiles(){const t={};ROWS.forEach(r=>COLS.forEach(c=>t[r+c]={mons:[],revealed:false,by:null,byColor:null,pts:null}));return t;}
function newGame(code){return {code,phase:'lobby',players:[],turn:0,tiles:emptyTiles(),seq:0,event:null,log:[],logSeq:0,endReason:''};}
function addLog(text){G.log.push({id:++G.logSeq,text});if(G.log.length>40)G.log.shift();}
const pl=id=>G.players.find(p=>p.id===id);
function placedCount(pid,type){let n=0;for(const t of Object.values(G.tiles))for(const m of t.mons)if(m.owner===pid&&(!type||m.type===type))n++;return n;}
const armyTotal=a=>a?ORDER.reduce((s,k)=>s+a[k],0):0;
function callable(pid){return Object.values(G.tiles).filter(t=>!t.revealed&&!t.mons.some(m=>m.owner===pid)).length;}

function viewFor(pid){
  const tiles={};
  for(const [pos,t] of Object.entries(G.tiles)){
    tiles[pos]={revealed:t.revealed,byColor:t.byColor,pts:t.pts,
      mons:t.revealed?t.mons:t.mons.filter(m=>m.owner===pid)}; // hidden monsters only go to their owner
  }
  const me=pl(pid);
  return {code:G.code,phase:G.phase,hostId:myId,turn:G.turn,tiles,event:G.event,log:G.log.slice(-12),endReason:G.endReason,
    myArmy:me?me.army:null,
    players:G.players.map(p=>({id:p.id,name:p.name,color:p.color,score:p.score,ready:p.ready,placed:placedCount(p.id),armySize:armyTotal(p.army)}))};
}
function broadcast(){
  for(const [id,c] of conns){ if(c.open) try{c.send({type:'VIEW',view:viewFor(id)})}catch(e){} }
  applyView(viewFor(myId));
  if(isLocal){
    const nv=localViewer();
    pendingViewer=(nv&&nv!==myId&&(G.phase==='placing'||G.phase==='playing'))?nv:null;
    render();
  }
}
function localViewer(){
  if(!G)return null;
  if(G.phase==='placing'){const p=G.players.find(x=>!x.ready);return p?p.id:myId;}
  if(G.phase==='playing')return G.players[G.turn]?G.players[G.turn].id:myId;
  return myId;
}
function dealArmies(){
  shuffle(G.players); // random turn order
  G.players.forEach(p=>{p.army={BLOB:0,GUARD:0,SORCERER:0,QUEEN:0,KING:0};p.ready=false;p.score=0;});
  const n=G.players.length;
  G.players.forEach(p=>{p.army.KING=1;p.army.QUEEN=1;}); // every player hides their own King and Queen
  let i=0;
  ['GUARD','SORCERER','BLOB'].forEach(type=>{for(let k=0;k<TYPES[type].count;k++)G.players[(i++)%n].army[type]++;});
  G.tiles=emptyTiles(); G.turn=0; G.event=null; G.endReason='';
}
function endGame(reason){G.phase='over';G.endReason=reason;addLog('🏁 '+reason);}
function checkEnd(){
  if(G.phase!=='playing')return;
  if(G.players.length<2){endGame('Not enough hunters left!');return;}
  const stuck=G.players.find(p=>callable(p.id)===0);
  if(stuck)endGame(`${stuck.name} has no places left to call!`);
}
function startPlaying(){
  G.phase='playing'; G.turn=0;
  addLog(`⚔️ The hunt begins! ${G.players[0].name} fires first.`);
  checkEnd();
}

function hostHandle(pid,m){
  if(!G||!m)return;
  const p=pl(pid); if(!p)return;
  switch(m.type){
    case 'START':
      if(pid!==myId||G.phase!=='lobby'||G.players.length<2)return;
      dealArmies(); G.phase='placing';
      addLog('🛠️ Hide your monsters! Only you can see where yours are.');
      break;
    case 'PLACE':{
      if(G.phase!=='placing'||p.ready)return;
      const t=G.tiles[m.pos]; if(!t||!TYPES[m.mon])return;
      if(t.mons.some(x=>x.owner===pid))return;
      if(placedCount(pid,m.mon)>=p.army[m.mon])return;
      t.mons.push({owner:pid,type:m.mon}); break;}
    case 'UNPLACE':{
      if(G.phase!=='placing'||p.ready)return;
      const t=G.tiles[m.pos]; if(!t)return;
      t.mons=t.mons.filter(x=>x.owner!==pid); break;}
    case 'CLEAR':
      if(G.phase!=='placing'||p.ready)return;
      Object.values(G.tiles).forEach(t=>t.mons=t.mons.filter(x=>x.owner!==pid)); break;
    case 'AUTO':{
      if(G.phase!=='placing'||p.ready)return;
      const free=shuffle(Object.keys(G.tiles).filter(k=>!G.tiles[k].mons.some(x=>x.owner===pid)));
      ORDER.forEach(type=>{let need=p.army[type]-placedCount(pid,type);while(need-->0&&free.length)G.tiles[free.pop()].mons.push({owner:pid,type});});
      break;}
    case 'READY':
      if(G.phase!=='placing')return;
      if(m.value&&placedCount(pid)!==armyTotal(p.army))return;
      p.ready=!!m.value;
      if(G.players.every(x=>x.ready))startPlaying();
      break;
    case 'STRIKE':{
      if(G.phase!=='playing')return;
      if(G.players[G.turn]?.id!==pid)return;
      const t=G.tiles[m.pos]; if(!t||t.revealed)return;
      if(t.mons.some(x=>x.owner===pid))return; // can't strike your own monster
      t.revealed=true; t.by=pid; t.byColor=p.color;
      let total=0;
      t.mons.forEach(x=>{const d=TYPES[x.type];x.pts=rand(d.min,d.max);total+=x.pts;});
      t.pts=total; p.score+=total;
      G.event={seq:++G.seq,pos:m.pos,byName:p.name,total,hits:t.mons.map(x=>({type:x.type,pts:x.pts}))};
      if(!t.mons.length) addLog(`💨 ${p.name} fired at ${m.pos}: nothing but grass.`);
      else addLog(`💥 ${p.name} blasted ${m.pos}: `+t.mons.map(x=>`${pl(x.owner)?.name||'?'}'s ${TYPES[x.type].name} (${fmt(x.pts)})`).join(' & '));
      G.turn=(G.turn+1)%G.players.length;
      checkEnd();
      break;}
    case 'RENAME':{
      if(pid!==myId)return;
      const t=pl(m.target), nm=String(m.name||'').trim().slice(0,14);
      if(!t||!nm)return;
      if(t.name===nm)return;
      addLog(`✏️ ${t.name} is now called ${nm}.`); t.name=nm; break;}
    case 'KICK':{
      if(pid!==myId||m.target===myId)return;
      const t=pl(m.target); if(!t)return;
      if(isLocal&&G.players.length<=2)return;
      const c=conns.get(m.target);
      if(c){try{c.send({type:'KICKED'})}catch(e){} setTimeout(()=>{try{c.close()}catch(e){}},400); conns.delete(m.target);}
      removePlayer(m.target,'kick');
      return;}
    case 'RESTART':
      if(pid!==myId||G.phase!=='over')return;
      G.phase='lobby'; G.tiles=emptyTiles(); G.event=null; G.turn=0; G.endReason='';
      G.players.forEach(x=>{x.score=0;x.ready=false;x.army=null;});
      if(isLocal){dealArmies();G.phase='placing';addLog('🔄 New hunt! Hide your monsters again.');}
      else addLog('🔄 New hunt! Waiting for the host to start.');
      break;
    default: return;
  }
  broadcast();
}
function dropPlayer(pid){
  if(!G||!conns.has(pid))return;
  conns.delete(pid);
  removePlayer(pid);
}
function removePlayer(pid,why){
  if(!G)return;
  const idx=G.players.findIndex(p=>p.id===pid); if(idx<0)return;
  const [p]=G.players.splice(idx,1);
  Object.values(G.tiles).forEach(t=>{if(!t.revealed)t.mons=t.mons.filter(m=>m.owner!==pid);});
  addLog(why==='kick'?`🥾 ${p.name} was removed by the host.`:`🚪 ${p.name} left the hunt.`);
  if(G.phase==='placing'){
    if(G.players.length<2){G.phase='lobby';G.tiles=emptyTiles();G.players.forEach(x=>{x.ready=false;x.army=null;});addLog('Back to the waiting room: not enough hunters.');}
    else if(G.players.every(x=>x.ready))startPlaying();
  } else if(G.phase==='playing'){
    if(idx<G.turn)G.turn--;
    if(G.turn>=G.players.length)G.turn=0;
    checkEnd();
  }
  broadcast();
}

/* =================================================================
   NETWORKING
   ================================================================= */
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function getName(fallback){return ($('#playerName').value.trim()||fallback).slice(0,14);}
function setLobbyMsg(t){$('#lobbyMsg').textContent=t||'';}
function send(msg){
  if(isHost)hostHandle(myId,msg);
  else if(hostConn&&hostConn.open)hostConn.send(msg);
}
function createRoom(){
  if(!window.Peer){setLobbyMsg('The multiplayer library did not load. Check your connection and reload.');return;}
  hardReset();
  const sid=session, name=getName('Host'), code=genCode();
  setLobbyMsg('Building your castle…');
  const createTimer=setTimeout(()=>{
    if(sid===session&&!G){hardReset();setLobbyMsg('Could not reach the room server. If you opened this inside the Claude preview, download the file and open it in your browser (or host it online).');}
  },10000);
  peer=new Peer(PREFIX+code,{debug:1});
  peer.on('open',id=>{
    if(sid!==session)return;
    clearTimeout(createTimer);
    isHost=true; myId=id; G=newGame(code);
    G.players.push({id,name,color:COLORS[0],score:0,ready:false,army:null});
    addLog(`🏰 ${name} opened room ${code}.`);
    setLobbyMsg(''); broadcast();
  });
  peer.on('connection',conn=>{
    conn.on('data',d=>{
      if(sid!==session||!G)return;
      if(d&&d.type==='JOIN'){
        if(conns.has(conn.peer))return;
        let reason='';
        if(G.phase!=='lobby')reason='That hunt has already started. Wait for the next one!';
        else if(G.players.length>=MAX_PLAYERS)reason='That room is full.';
        if(reason){conn.send({type:'REJECT',reason});setTimeout(()=>conn.close(),400);return;}
        conns.set(conn.peer,conn);
        const used=new Set(G.players.map(p=>p.color));
        const nm=String(d.name||'Hunter').slice(0,14);
        G.players.push({id:conn.peer,name:nm,color:COLORS.find(c=>!used.has(c))||'#888',score:0,ready:false,army:null});
        addLog(`👋 ${nm} joined the hunt.`);
        broadcast();
      } else if(conns.get(conn.peer)===conn){
        hostHandle(conn.peer,d);
      }
    });
    conn.on('close',()=>{if(sid===session)dropPlayer(conn.peer);});
    conn.on('error',()=>{if(sid===session)dropPlayer(conn.peer);});
  });
  peer.on('disconnected',()=>{if(sid===session&&peer&&!peer.destroyed)try{peer.reconnect()}catch(e){}});
  peer.on('error',err=>{
    if(sid!==session)return;
    if(err.type==='unavailable-id'){createRoom();return;}
    if(!G){clearTimeout(createTimer);hardReset();setLobbyMsg('Could not create a room ('+(err.type||'error')+'). Check your internet, or try opening the file in a normal browser tab.');}
    else console.warn(err);
  });
}
function joinRoom(){
  if(!window.Peer){setLobbyMsg('The multiplayer library did not load. Check your connection and reload.');return;}
  const code=$('#roomInput').value.trim().toUpperCase();
  if(code.length<5){setLobbyMsg('Enter the 5-letter room code.');return;}
  hardReset();
  const sid=session, name=getName('Hunter');
  setLobbyMsg('Marching to the room…');
  let opened=false;
  const fail=msg=>{if(sid!==session)return;hardReset();setLobbyMsg(msg);};
  const timer=setTimeout(()=>{if(!opened)fail('Room not found. Check the code and try again.');},12000);
  peer=new Peer({debug:1});
  peer.on('open',id=>{
    if(sid!==session)return;
    myId=id;
    const conn=peer.connect(PREFIX+code,{reliable:true});
    hostConn=conn;
    conn.on('open',()=>{if(sid!==session)return;opened=true;clearTimeout(timer);conn.send({type:'JOIN',name});setLobbyMsg('');});
    conn.on('data',d=>{
      if(sid!==session||!d)return;
      if(d.type==='VIEW')applyView(d.view);
      else if(d.type==='REJECT')fail(d.reason);
      else if(d.type==='KICKED'){hardReset();showModal('Removed from the room','The host removed you from the hunt.');}
    });
    conn.on('close',()=>{
      if(sid!==session)return;
      clearTimeout(timer);
      if(!opened){fail('Room not found. Check the code and try again.');return;}
      hardReset(); showModal('Hunt ended','The host left, so the hunt is over.');
    });
  });
  peer.on('error',err=>{
    if(sid!==session)return;
    clearTimeout(timer);
    if(err.type==='peer-unavailable')fail('Room not found. Check the code and try again.');
    else if(!V)fail('Could not connect. Check your internet and try again.');
  });
}
function startLocal(){
  hardReset();
  const names=$('#localNames').value.split(',').map(x=>x.trim().slice(0,14)).filter(Boolean).slice(0,MAX_PLAYERS);
  if(names.length<2){setLobbyMsg('Type at least 2 names, separated by commas.');return;}
  isLocal=true; isHost=true; G=newGame('LOCAL');
  names.forEach((n,i)=>G.players.push({id:'p'+(i+1),name:n,color:COLORS[i],score:0,ready:false,army:null}));
  dealArmies(); G.phase='placing';
  addLog('🛠️ Hide your monsters! Pass the device between turns.');
  myId=G.players[0].id;
  setLobbyMsg('');
  broadcast();
}
function hardReset(){
  session++;
  try{if(peer)peer.destroy();}catch(e){}
  peer=null; hostConn=null; isHost=false; myId=''; conns.clear();
  isLocal=false; pendingViewer=null;
  G=null; V=null; lastSeq=0; animating=false; strikeLock=false;
  evQueue.length=0; hiddenSet.clear(); $('#fx').innerHTML='';
  render();
}
function leaveGame(){
  hardReset();
  $('#roomInput').value=''; setLobbyMsg('');
  showModal('You left the hunt','Everything has been wiped clean. See you next time, hunter!');
}
window.addEventListener('beforeunload',()=>{try{if(peer)peer.destroy();}catch(e){}});

/* =================================================================
   CLIENT VIEW + RENDER
   ================================================================= */
function applyView(v){
  const prevTurn=V&&V.phase==='playing'?V.players[V.turn]?.id:null;
  V=v; strikeLock=false;
  if(v.phase==='lobby'||v.phase==='placing'){evQueue.length=0;hiddenSet.clear();}
  if(v.event&&v.event.seq>lastSeq){
    lastSeq=v.event.seq; evQueue.push(v.event); hiddenSet.add(v.event.pos);
    if(!animating)runQueue(); else render();
  } else render();
  const nowTurn=v.phase==='playing'?v.players[v.turn]?.id:null;
  if(nowTurn===myId&&prevTurn!==myId&&navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
}
const me=()=>V&&V.players.find(p=>p.id===myId);
function remaining(){
  const left={};ORDER.forEach(k=>left[k]=(V.myArmy?V.myArmy[k]:0));
  for(const t of Object.values(V.tiles))for(const m of t.mons)if(m.owner===myId&&!t.revealed)left[m.type]--;
  return left;
}

function render(){
  const phase=V?V.phase:null;
  $('#lobby').hidden=!!V;
  $('#room').hidden=phase!=='lobby';
  $('#game').hidden=!(phase==='placing'||phase==='playing'||phase==='over');
  $('#leaveBtn').hidden=!V;
  $('#status').textContent=V?(isLocal?'One-device game':`Room ${V.code}${isHost?' (you are the host)':''}`):'Not in a room';
  const showOver=phase==='over'&&!animating&&!evQueue.length;
  $('#over').hidden=!showOver;
  const showCover=!!(V&&isLocal&&pendingViewer&&!animating&&!evQueue.length);
  $('#cover').hidden=!showCover;
  if(showCover){
    const pp=V.players.find(x=>x.id===pendingViewer)||{name:'the next player'};
    $('#cover').classList.toggle('late',V.phase==='playing');
    $('#coverTitle').textContent='Pass the device to '+pp.name;
    $('#coverText').textContent=V.phase==='placing'?'Hide your monsters where nobody else can see the screen.':'Make sure only '+pp.name+' is looking at the screen.';
    $('#coverOk').textContent="I'm "+pp.name+', show my board';
  }
  if(!V)return;
  if(phase==='lobby')renderRoom(); else renderGame();
  if(showOver)renderOver();
}

function renderRoom(){
  $('#roomCode').textContent=V.code;
  $('#roomPlayers').innerHTML=V.players.map(p=>`<li class="chip" data-pid="${esc(p.id)}" style="--c:${p.color}"><span class="dot"></span>${esc(p.name)}${p.id===V.hostId?' 👑':''}${p.id===myId?' <small>(you)</small>':''}</li>`).join('');
  $('#roomTip').hidden=!isHost;
  $('#startBtn').hidden=!isHost;
  $('#startBtn').disabled=V.players.length<2;
  $('#roomWait').textContent=isHost
    ?(V.players.length<2?'You need at least 2 hunters to start.':`${V.players.length} hunters in the room. Start when everyone's here!`)
    :'Waiting for the host to start the hunt…';
}

function renderGame(){
  const m=me(), placing=V.phase==='placing', playing=V.phase==='playing';
  const cur=V.players[V.turn], myTurn=playing&&cur&&cur.id===myId;
  document.documentElement.style.setProperty('--me',m?m.color:'#888');

  // scoreboard
  $('#scoreboard').innerHTML=V.players.map((p,i)=>{
    const right=placing?(p.ready?'✅ ready':`🛠️ ${p.placed}/${p.armySize}`):`<b class="${p.score<0?'neg':'pos'}">${p.score}</b> pt`;
    return `<div class="score ${playing&&i===V.turn?'turn':''}" data-pid="${esc(p.id)}" style="--c:${p.color}"><span class="dot"></span><span>${esc(p.name)}${p.id===myId?' <small>(you)</small>':''}</span><span>${right}</span></div>`;
  }).join('');

  // banner
  const b=$('#banner'); b.className='banner';
  if(placing) b.textContent=m&&m.ready?'✅ Ready! Waiting for the other hunters…':'🛠️ Hide your monsters: pick one, then tap a square';
  else if(playing){
    if(myTurn){b.textContent='👉 Your turn! Tap a square to fire';b.classList.add('mine');}
    else b.textContent=`🎯 ${cur?cur.name:'…'} is aiming…`;
  } else b.textContent='🏁 The hunt is over!';

  // tray + actions (placement) / legend (play)
  const tray=$('#tray'), actions=$('#actions'), legend=$('#legend');
  if(placing&&m&&!m.ready){
    const left=remaining();
    if(!left[selectedType]){const n=ORDER.find(k=>left[k]>0);if(n)selectedType=n;}
    tray.hidden=false;
    tray.innerHTML=ORDER.filter(k=>V.myArmy&&V.myArmy[k]>0).map(k=>
      `<button class="pick ${k===selectedType?'sel':''} ${left[k]?'':'empty'}" data-type="${k}" aria-pressed="${k===selectedType}">
        <span class="pick-art">${ART[k]}</span><span class="pick-name">${TYPES[k].name}</span><span class="pick-left">×${left[k]}</span></button>`).join('');
    const allPlaced=ORDER.every(k=>left[k]<=0);
    actions.hidden=false;
    actions.innerHTML=`<button class="btn blue small" data-act="AUTO">🎲 Random fill</button>
      <button class="btn yellow small" data-act="CLEAR">🧹 Clear</button>
      <button class="btn green small" data-act="READY" ${allPlaced?'':'disabled'}>✅ I'm ready</button>`;
  } else if(placing&&m&&m.ready){
    tray.hidden=true;
    actions.hidden=false;
    actions.innerHTML=`<button class="btn yellow small" data-act="UNREADY">✋ Wait, let me move things</button>`;
  } else {tray.hidden=true;actions.hidden=true;}
  legend.hidden=placing;
  if(!placing) legend.innerHTML=ORDER.map(k=>{const d=TYPES[k];return `<span class="leg"><span>${ART[k]}</span>${d.name} ${fmt(d.min)}~${fmt(d.max)}</span>`;}).join('');

  // board
  const canPlace=placing&&m&&!m.ready, canFire=myTurn&&!animating&&!strikeLock;
  let h='<div class="hdr"></div>'+COLS.map(c=>`<div class="hdr">${c}</div>`).join('');
  ROWS.forEach(r=>{
    h+=`<div class="hdr">${r}</div>`;
    COLS.forEach(c=>{
      const pos=r+c, t=V.tiles[pos], open=t.revealed&&!hiddenSet.has(pos);
      const mine=t.revealed?[]:t.mons.filter(x=>x.owner===myId);
      let cls='tile', inner='', style='', label=pos;
      if(open){
        cls+=' open'; style=`--striker:${t.byColor||'#888'}`;
        if(!t.mons.length){inner=`<span class="art">${MISS}</span>`;label+=', empty';}
        else{
          inner=t.mons.length===1?`<span class="art">${ART[t.mons[0].type]}</span>`:`<span class="stack">${t.mons.map(x=>`<span>${ART[x.type]}</span>`).join('')}</span>`;
          inner+=`<span class="pts ${t.pts<0?'neg':''}">${fmt(t.pts)}</span>`;
          label+=', '+t.mons.map(x=>TYPES[x.type].name).join(' and ');
        }
        if(V.event&&V.event.pos===pos&&!animating)cls+=' last';
      } else {
        cls+=' closed';
        if(t.revealed&&hiddenSet.has(pos)){/* about to be revealed: hide everything */}
        else if(mine.length){
          cls+=' mine'; inner=`<span class="art">${ART[mine[0].type]}</span>`; label+=`, your ${TYPES[mine[0].type].name}`;
          if(!placing){cls+=' locked';inner+='<span class="lock">🔒</span>';}
        }
        if(canPlace)cls+=' can';
        if(canFire&&!mine.length)cls+=' can firing';
      }
      h+=`<button class="${cls}" data-pos="${pos}" style="${style}" aria-label="${label}">${inner}</button>`;
    });
  });
  $('#grid').innerHTML=h;
  $('#fireHint').textContent=placing?'Two hunters can hide on the same square. A hit there strikes both!'
    :'Your own monsters show a 🔒. You can\'t fire at them.';

  // log
  $('#log').innerHTML=V.log.slice().reverse().map(l=>`<li>${esc(l.text)}</li>`).join('');
}

function renderOver(){
  $('#overReason').textContent=V.endReason||'';
  const medals=['🥇','🥈','🥉'];
  const sorted=V.players.slice().sort((a,b)=>b.score-a.score);
  $('#rank').innerHTML=sorted.map((p,i)=>`<li style="--c:${p.color}"><span class="m">${medals[i]||'🎖️'}</span><span class="nm">${esc(p.name)}${p.id===myId?' <small>(you)</small>':''}</span><span>${p.score} pt</span></li>`).join('');
  $('#overBtns').innerHTML=(isHost?`<button class="btn green" style="flex:1" data-over="RESTART">🔄 New hunt</button>`:'')+
    `<button class="btn red" style="flex:1" data-over="LEAVE">🚪 Leave</button>`;
  if(!isHost&&!$('#overWait')){$('#overBtns').insertAdjacentHTML('beforebegin','<p id="overWait" style="margin-bottom:10px">The host can start a new hunt.</p>');}
  if(isHost&&$('#overWait'))$('#overWait').remove();
}

/* ---------- interactions ---------- */
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)onTile(b.dataset.pos);});
function onTile(pos){
  if(!V)return;
  const t=V.tiles[pos], m=me(); if(!t||!m)return;
  const mine=!t.revealed&&t.mons.some(x=>x.owner===myId);
  if(V.phase==='placing'){
    if(m.ready)return toast('You\'re marked ready. Tap "Wait" to move monsters.');
    if(mine)return send({type:'UNPLACE',pos});
    const left=remaining();
    if(!left[selectedType]){const n=ORDER.find(k=>left[k]>0);if(!n)return toast('All monsters placed! Tap "I\'m ready".');selectedType=n;}
    send({type:'PLACE',pos,mon:selectedType});
  } else if(V.phase==='playing'){
    if(animating||strikeLock)return;
    const cur=V.players[V.turn];
    if(!cur||cur.id!==myId)return toast(`Not your turn. ${cur?cur.name:'Someone'} is aiming!`);
    if(t.revealed)return toast(`${pos} was already blasted!`);
    if(mine)return toast('You can\'t fire at your own monster!');
    strikeLock=true; render();
    send({type:'STRIKE',pos});
  }
}
$('#tray').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b)return;selectedType=b.dataset.type;render();});
$('#actions').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='READY')send({type:'READY',value:true});
  else if(a==='UNREADY')send({type:'READY',value:false});
  else send({type:a});
});
$('#overBtns').addEventListener('click',e=>{
  const b=e.target.closest('[data-over]');if(!b)return;
  if(b.dataset.over==='RESTART')send({type:'RESTART'}); else leaveGame();
});
$('#createBtn').onclick=createRoom;
$('#joinBtn').onclick=joinRoom;
$('#localBtn').onclick=startLocal;
$('#localNames').addEventListener('keydown',e=>{if(e.key==='Enter')startLocal();});
$('#coverOk').onclick=()=>{if(!pendingViewer)return;myId=pendingViewer;pendingViewer=null;applyView(viewFor(myId));};
$('#roomInput').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
$('#startBtn').onclick=()=>send({type:'START'});
$('#leaveBtn').onclick=leaveGame;

/* ---------- host: long-press a player to rename / remove ---------- */
let menuPid=null, kickArmed=false, lpTimer=null, lpFired=false, lpStart=null;
function openPlayerMenu(pid){
  if(!isHost||!V)return;
  const p=V.players.find(x=>x.id===pid); if(!p)return;
  menuPid=pid; kickArmed=false;
  $('#pmTitle').textContent=p.name;
  $('#pmName').value=p.name;
  $('#pmKick').textContent='🥾 Remove from game';
  $('#pmKick').hidden=!(pid!==myId&&!(isLocal&&V.players.length<=2));
  $('#pmenu').hidden=false;
}
function closePlayerMenu(){$('#pmenu').hidden=true;menuPid=null;kickArmed=false;lpFired=false;}
function savePlayerName(){
  const nm=$('#pmName').value.trim();
  if(!nm){toast('Type a name first.');return;}
  send({type:'RENAME',target:menuPid,name:nm});
  closePlayerMenu();
}
$('#pmSave').onclick=savePlayerName;
$('#pmName').addEventListener('keydown',e=>{if(e.key==='Enter')savePlayerName();});
$('#pmCancel').onclick=closePlayerMenu;
$('#pmenu').addEventListener('click',e=>{if(e.target.id==='pmenu')closePlayerMenu();});
$('#pmKick').onclick=()=>{
  if(!kickArmed){kickArmed=true;$('#pmKick').textContent='Tap again to remove';return;}
  send({type:'KICK',target:menuPid});
  closePlayerMenu();
};
function bindLongPress(box){
  box.addEventListener('pointerdown',e=>{
    const el=e.target.closest('[data-pid]'); if(!el||!isHost||!V)return;
    lpFired=false; lpStart={x:e.clientX,y:e.clientY};
    clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{lpFired=true;openPlayerMenu(el.dataset.pid);if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}},550);
  });
  box.addEventListener('contextmenu',e=>{
    const el=e.target.closest('[data-pid]'); if(!el||!isHost)return;
    e.preventDefault(); clearTimeout(lpTimer);
    if(!lpFired){lpFired=true;openPlayerMenu(el.dataset.pid);}
  });
}
bindLongPress($('#roomPlayers'));
bindLongPress($('#scoreboard'));
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>clearTimeout(lpTimer)));
window.addEventListener('pointermove',e=>{if(lpStart&&Math.hypot(e.clientX-lpStart.x,e.clientY-lpStart.y)>10)clearTimeout(lpTimer);});
$('#modalOk').onclick=()=>{$('#modal').hidden=true;};
function showModal(title,text){$('#modalTitle').textContent=title;$('#modalText').textContent=text;$('#modal').hidden=false;}
let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);}

/* =================================================================
   CANNONBALL ANIMATION
   ================================================================= */
function runQueue(){
  if(!evQueue.length){animating=false;render();return;}
  animating=true;
  const ev=evQueue.shift();
  render();
  playStrike(ev,()=>setTimeout(runQueue,150));
}
function fxAt(cls,x,y,extra='',html=''){
  const d=document.createElement('div');d.className=cls;
  d.style.cssText=`--x:${x}px;--y:${y}px;${extra}`;d.innerHTML=html;
  $('#fx').appendChild(d);return d;
}
function playStrike(ev,done){
  const wrap=$('#boardWrap'), tileEl=document.querySelector(`.tile[data-pos="${ev.pos}"]`), cannon=$('#cannon');
  const reveal=()=>{
    hiddenSet.delete(ev.pos);
    if(!evQueue.length)animating=false;
    render();
    const el=document.querySelector(`.tile[data-pos="${ev.pos}"]`);
    if(el){
      el.classList.add('pop');
      const wr=wrap.getBoundingClientRect(),r=el.getBoundingClientRect();
      const txt=ev.hits.length?fmt(ev.total):'Miss!';
      const col=!ev.hits.length?'#c9d1d9':ev.total<0?'#ff5a52':'#47e07a';
      const f=fxAt('float',r.left-wr.left+r.width/2,r.top-wr.top,`--fc:${col}`);f.textContent=txt;
      setTimeout(()=>f.remove(),1500);
    }
    const types=ev.hits.map(h=>h.type);
    if(types.includes('KING'))toast(`👑 ${ev.byName} toppled the KING!`);
    else if(types.includes('QUEEN'))toast(`👸 ${ev.byName} caught the Queen!`);
    else if(types.includes('SORCERER'))toast(`🧙 Hexed! ${ev.byName} loses points`);
    done();
  };
  if(!tileEl||!cannon||document.hidden){setTimeout(reveal,50);return;}
  const wr=wrap.getBoundingClientRect(), tr=tileEl.getBoundingClientRect(), cr=cannon.getBoundingClientRect();
  const sx=cr.left-wr.left+cr.width*.84, sy=cr.top-wr.top+cr.height*.12;
  const tx=tr.left-wr.left+tr.width/2, ty=tr.top-wr.top+tr.height/2;
  const cx=sx+(tx-sx)*.35, cy=Math.min(sy,ty)-120;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  cannon.classList.remove('fire'); void cannon.offsetWidth; cannon.classList.add('fire');
  for(let i=0;i<3;i++){const p=fxAt('puff',sx+rand(-6,6),sy+rand(-6,6),`--s:${rand(14,22)}px`);setTimeout(()=>p.remove(),650);}

  const ball=document.createElement('div');ball.className='ball';$('#fx').appendChild(ball);
  const dur=reduce?250:800, t0=performance.now(); let frame=0;
  function step(now){
    const k=Math.min(1,(now-t0)/dur), u=1-k;
    const x=u*u*sx+2*u*k*cx+k*k*tx, y=u*u*sy+2*u*k*cy+k*k*ty;
    const s=1+.65*Math.sin(Math.PI*k);
    ball.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${k*540}deg)`;
    if(!reduce&&++frame%3===0){const p=fxAt('puff',x,y,'--s:9px');setTimeout(()=>p.remove(),650);}
    if(k<1)requestAnimationFrame(step);
    else{
      ball.remove();
      const words=['BOOM!','KABOOM!','POW!','BLAM!'];
      const bm=fxAt('boom',tx,ty,'',BURST+`<span>${words[rand(0,3)]}</span>`);setTimeout(()=>bm.remove(),650);
      const cols=['#ffb300','#e65100','#6d4c41','#ffd54f','#8d6e63'];
      for(let i=0;i<10;i++){const a=Math.PI*2*i/10+Math.random()*.4,d=rand(30,60);
        const p=fxAt('debris',tx,ty,`--dc:${cols[i%5]};--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px`);setTimeout(()=>p.remove(),700);}
      if(!reduce){$('#grid').classList.remove('shake');void $('#grid').offsetWidth;$('#grid').classList.add('shake');}
      setTimeout(reveal,330);
    }
  }
  requestAnimationFrame(step);
}

render();
</script>
